# Kindle E-Ink Dashboard Configuration
# You can use your local server or production URL:
# SERVER_URL="http://192.168.2.125:8080"
SERVER_URL="https://www.forusers.com"

# Refresh interval in seconds (900 = 15 minutes, 1800 = 30 minutes, 3600 = 1 hour)
REFRESH_INTERVAL=900

# Rotation: 90 (Landscape with USB on the RIGHT), 270 (USB on the LEFT)
ROTATION=90

# Keep screen awake (1 = stay on continuously when plugged in, 0 = allow sleep)
PREVENT_SLEEP=1

# Auto-Backlight (Frontlight):
# 1 = Turn on backlight when plugged in, turn off when running on battery
# 0 = Do not manage backlight automatically
AUTO_BACKLIGHT=1

# Backlight brightness level when plugged in (0 to 24, e.g. 14 is bright & crisp)
BACKLIGHT_PLUGGED_INTENSITY=14
